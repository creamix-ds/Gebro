<link rel="stylesheet" href="css/estilos.css?v=16">

<!-- Esqueleto de carga: se ve al instante y lo reemplaza app.js al terminar de dibujar. -->
<style>
.gb-boot{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72vh;gap:20px}
.gb-boot__logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#2CCFBF,#0A7EA4);box-shadow:0 8px 24px rgba(10,126,164,.25);animation:gb-pulse 1.1s ease-in-out infinite}
.gb-boot__bar{width:150px;height:8px;border-radius:99px;background:rgba(127,150,140,.22);overflow:hidden;position:relative}
.gb-boot__bar span{position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:99px;background:linear-gradient(90deg,#2CCFBF,#0A7EA4);animation:gb-slide 1.15s ease-in-out infinite}
@keyframes gb-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.55}}
@keyframes gb-slide{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion: reduce){.gb-boot__logo,.gb-boot__bar span{animation:none}}
</style>
</head>
<body>
<div id="app" aria-live="polite"><div class="gb-boot" role="status" aria-label="Cargando Gebro"><div class="gb-boot__logo"></div><div class="gb-boot__bar"><span></span></div></div></div>
<div id="capa"></div>
<div id="avisos" role="status"></div>

<!-- Scripts al final del body (posición original, estable). -->
<script src="js/config.js?v=16"></script>
<script src="js/modulos.js?v=16"></script>
<script src="js/motor.js?v=16"></script>
<script src="js/demo.js?v=16"></script>
<script src="js/app.js?v=16"></script>
</body>
